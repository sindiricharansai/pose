<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUMINA Studio | Photo & Video Editor</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Custom Styles -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col font-sans selection:bg-amber-500 selection:text-black">

  <!-- TOP HEADER -->
  <header class="h-16 border-b border-zinc-800 bg-zinc-900/90 backdrop-blur px-6 flex items-center justify-between sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-lg bg-gradient-to-tr from-amber-500 to-amber-300 flex items-center justify-center text-zinc-950 font-black shadow-lg shadow-amber-500/20">
        <i data-lucide="sliders-horizontal" class="w-5 h-5"></i>
      </div>
      <div>
        <h1 class="text-sm font-bold tracking-wider uppercase text-zinc-100">Lumina <span class="text-amber-400">Studio</span></h1>
        <p class="text-[10px] text-zinc-400 font-mono">In-Browser Media Suite</p>
      </div>
    </div>

    <!-- Mode Switcher -->
    <div class="flex bg-zinc-800 p-1 rounded-xl border border-zinc-700">
      <button id="tab-photo" class="px-5 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-2 bg-amber-500 text-zinc-950 shadow transition-all">
        <i data-lucide="image" class="w-4 h-4"></i> Photo Editor
      </button>
      <button id="tab-video" class="px-5 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-2 text-zinc-400 hover:text-zinc-200 transition-all">
        <i data-lucide="video" class="w-4 h-4"></i> Video Studio
      </button>
    </div>

    <!-- Quick Actions -->
    <div class="flex items-center gap-3">
      <label for="file-upload" class="cursor-pointer px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-200 rounded-lg text-xs font-medium flex items-center gap-2 border border-zinc-700 transition">
        <i data-lucide="upload" class="w-4 h-4 text-amber-400"></i> Open File
      </label>
      <input type="file" id="file-upload" class="hidden" accept="image/*,video/*">
      <button id="btn-export-main" class="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-zinc-950 font-bold rounded-lg text-xs flex items-center gap-2 shadow-lg shadow-amber-500/10 transition">
        <i data-lucide="download" class="w-4 h-4"></i> Export Result
      </button>
    </div>
  </header>

  <!-- MAIN APP CONTAINER -->
  <div class="flex-1 flex overflow-hidden">
    
    <!-- LEFT SIDEBAR: CONTROLS & FILTERS -->
    <aside class="w-80 border-r border-zinc-800 bg-zinc-900/40 p-5 flex flex-col gap-6 overflow-y-auto">
      
      <!-- PHOTO CONTROLS -->
      <div id="photo-controls" class="space-y-6">
        <div>
          <h2 class="text-xs font-bold uppercase tracking-wider text-zinc-400 mb-3 flex items-center gap-2">
            <i data-lucide="sparkles" class="w-3.5 h-3.5 text-amber-400"></i> Color Grading
          </h2>
          <div class="space-y-3 text-xs">
            <div>
              <div class="flex justify-between text-zinc-400 mb-1">
                <span>Brightness</span><span id="val-brightness">100%</span>
              </div>
              <input type="range" id="p-brightness" min="0" max="200" value="100" class="w-full accent-amber-500">
            </div>

            <div>
              <div class="flex justify-between text-zinc-400 mb-1">
                <span>Contrast</span><span id="val-contrast">100%</span>
              </div>
              <input type="range" id="p-contrast" min="0" max="200" value="100" class="w-full accent-amber-500">
            </div>

            <div>
              <div class="flex justify-between text-zinc-400 mb-1">
                <span>Saturation</span><span id="val-saturate">100%</span>
              </div>
              <input type="range" id="p-saturate" min="0" max="200" value="100" class="w-full accent-amber-500">
            </div>

            <div>
              <div class="flex justify-between text-zinc-400 mb-1">
                <span>Hue Shift</span><span id="val-hue">0°</span>
              </div>
              <input type="range" id="p-hue" min="0" max="360" value="0" class="w-full accent-amber-500">
            </div>

            <div>
              <div class="flex justify-between text-zinc-400 mb-1">
                <span>Warmth / Sepia</span><span id="val-sepia">0%</span>
              </div>
              <input type="range" id="p-sepia" min="0" max="100" value="0" class="w-full accent-amber-500">
            </div>

            <div>
              <div class="flex justify-between text-zinc-400 mb-1">
                <span>Blur</span><span id="val-blur">0px</span>
              </div>
              <input type="range" id="p-blur" min="0" max="20" value="0" class="w-full accent-amber-500">
            </div>
          </div>
        </div>

        <!-- Presets -->
        <div>
          <h2 class="text-xs font-bold uppercase tracking-wider text-zinc-400 mb-3 flex items-center gap-2">
            <i data-lucide="palette" class="w-3.5 h-3.5 text-amber-400"></i> Cinematic Presets
          </h2>
          <div class="grid grid-cols-2 gap-2 text-xs">
            <button class="preset-btn px-3 py-2 rounded-lg bg-zinc-800 hover:bg-zinc-700 border border-zinc-700/60 transition text-left" data-preset="natural">Normal</button>
            <button class="preset-btn px-3 py-2 rounded-lg bg-zinc-800 hover:bg-zinc-700 border border-zinc-700/60 transition text-left" data-preset="vintage">70s Vintage</button>
            <button class="preset-btn px-3 py-2 rounded-lg bg-zinc-800 hover:bg-zinc-700 border border-zinc-700/60 transition text-left" data-preset="noir">Film Noir</button>
            <button class="preset-btn px-3 py-2 rounded-lg bg-zinc-800 hover:bg-zinc-700 border border-zinc-700/60 transition text-left" data-preset="cyber">Cyberpunk</button>
          </div>
        </div>

        <!-- Geometry -->
        <div>
          <h2 class="text-xs font-bold uppercase tracking-wider text-zinc-400 mb-3 flex items-center gap-2">
            <i data-lucide="crop" class="w-3.5 h-3.5 text-amber-400"></i> Transform
          </h2>
          <div class="grid grid-cols-3 gap-2">
            <button id="btn-rot-left" class="p-2 bg-zinc-800 hover:bg-zinc-700 rounded-lg flex items-center justify-center text-zinc-300" title="Rotate Left">
              <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
            </button>
            <button id="btn-rot-right" class="p-2 bg-zinc-800 hover:bg-zinc-700 rounded-lg flex items-center justify-center text-zinc-300" title="Rotate Right">
              <i data-lucide="rotate-cw" class="w-4 h-4"></i>
            </button>
            <button id="btn-flip-h" class="p-2 bg-zinc-800 hover:bg-zinc-700 rounded-lg flex items-center justify-center text-zinc-300" title="Flip Horizontal">
              <i data-lucide="flip-horizontal" class="w-4 h-4">
